<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Pages – Skagestad Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a, #111827);
    color: white;
    text-align: center;
    padding: 60px 20px;
}

h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
}

.menu {
    display: grid;
    gap: 18px;
    max-width: 520px;
    margin: auto;
}

.card {
    background: #1e293b;
    padding: 22px;
    border-radius: 14px;
    text-decoration: none;
    color: white;
    border: 1px solid #1f2937;
    transition: all 0.25s ease;
}

.card:hover {
    background: #334155;
    border-color: #3b82f6;
    transform: translateY(-4px);
}

.card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
}

.card-desc {
    font-size: 13px;
    color: #cbd5e1;
}

.back-btn {
    display:block;
    width:100%;
    max-width:520px;
    margin:25px auto 0;
    padding:14px;
    border-radius:10px;
    background:#334155;
    color:#e2e8f0;
    text-decoration:none;
}

.back-btn:hover {
    background:#475569;
}

.footer {
    margin-top:60px;
    font-size:12px;
    opacity:.6;
}
</style>
</head>

<body>

<h1>🌐 Web Pages</h1>
<div class="subtitle">Other projects and external sites</div>

<div class="menu">

<a href="https://skagestadfoto.net" class="card">
<div class="card-title">📷 Skagestad Foto</div>
<div class="card-desc">My photography portfolio</div>
</a>

<a href="https://energidrikkteller.net" class="card">
<div class="card-title">⚡ Energidrikk Teller</div>
<div class="card-desc">Energy drink counter</div>
</a>

</div>

<a href="index.html" class="back-btn">← Back to Skagestad Labs</a>

<div class="footer">Skagestad Labs © 2026</div>

</body>
</html>
