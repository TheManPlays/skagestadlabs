<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IT Support Tools – Skagestad Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at top,#0f172a,#020617);
    color:#e2e8f0;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:100vh;
}

/* main card */

.container{
    width:100%;
    max-width:720px;
}

.card{
    background:#1e293b;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

/* title */

h1{
    font-size:24px;
    margin-bottom:6px;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:20px;
}

/* inputs */

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;

    border-radius:8px;
    border:1px solid #334155;

    background:#0f172a;
    color:white;

    font-size:14px;
    outline:none;

    box-sizing:border-box; /* viktig */
}

input:focus,select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,.2);
}

/* result cards */

.result{
    background:#0f172a;
    border:1px solid #334155;
    padding:16px;
    border-radius:10px;
    margin-top:15px;
}

.result strong{
    font-size:15px;
}

/* results container */

#results{
    margin-top:15px;
}

/* back button */

.back{
    display:block;
    margin-top:20px;
    padding:12px;
    text-align:center;

    border-radius:10px;
    background:#334155;
    color:#e2e8f0;
    text-decoration:none;

    transition:.2s;
}

.back:hover{
    background:#475569;
}

/* footer */

.footer{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:#94a3b8;
    opacity:.7;
}

.loading{
    opacity:.6;
}

    .back-btn{
    display:block;
    width:100%;
    margin-top:20px;
    padding:14px;

    text-align:center;
    text-decoration:none;

    border-radius:10px;

    background:#334155;
    color:#e2e8f0;

    font-size:14px;
    font-weight:500;

    transition:all .2s ease;
}

.back-btn:hover{
    background:#475569;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🖥️ IT Support Tools</h1>
<div class="subtitle">
Search for common error codes and troubleshooting steps
</div>

<select id="categoryFilter">
<option value="all">All Categories</option>
<option value="windows">Windows</option>
<option value="network">Network</option>
<option value="printer">Printer</option>
<option value="hardware">Hardware</option>
</select>

<input type="text" id="searchInput" placeholder="Search error code or issue...">

<div id="results" class="loading">Loading database...</div>

<a class="back" href="index.html">← Back to Skagestad Labs</a>

</div>

</div>

<div class="footer">
Skagestad Labs © 2026
</div>

<script>

let errorDatabase = [];
let databaseReady = false;

const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const results = document.getElementById("results");


fetch("./errors.json")
.then(res => {
    if(!res.ok){
        throw new Error("HTTP "+res.status);
    }
    return res.json();
})
.then(data => {

    errorDatabase = data;
    databaseReady = true;

    results.classList.remove("loading");
    results.innerHTML = "";

})
.catch(err => {

    console.error("Database load failed:",err);

    results.innerHTML =
    "<div class='result'>Database failed to load.</div>";

});


function searchErrors(){

    if(!databaseReady) return;

    const query = searchInput.value.toLowerCase().trim();
    const category = categoryFilter.value;

    results.innerHTML = "";

    if(!query){
        return;
    }

    const words = query.split(/\s+/);

    let matches = errorDatabase.filter(entry=>{

        if(category !== "all" && entry.category !== category){
            return false;
        }

        const searchable =
        entry.title +
        " " +
        entry.cause +
        " " +
        entry.keywords.join(" ");

        const text = searchable.toLowerCase();

        return words.every(word => text.includes(word));

    });

    if(matches.length === 0){

        results.innerHTML =
        "<div class='result'>No results found.</div>";

        return;

    }

    matches.slice(0,10).forEach(e=>{

        results.innerHTML += `
        <div class="result">
        <strong>${e.title}</strong><br><br>
        <b>Cause:</b> ${e.cause}<br><br>
        <b>Resolution:</b> ${e.fix}
        </div>
        `;

    });

}


let timeout;

searchInput.addEventListener("input",()=>{

    clearTimeout(timeout);
    timeout = setTimeout(searchErrors,150);

});

categoryFilter.addEventListener("change",searchErrors);

</script>

</body>
</html>
