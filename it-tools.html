<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Tools – Skagestad Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#0f172a,#111827);
    color:#e2e8f0;
    font-family:'Inter',sans-serif;
    margin:0;
    padding:60px 20px;
}

.container{
    max-width:900px;
    margin:auto;
}

/* header */

h1{
    font-size:30px;
    margin-bottom:6px;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:30px;
}

/* inputs */

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #334155;
    background:#1e293b;
    color:white;
    font-size:14px;
    outline:none;
    transition:all .2s;
}

input:focus,select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,0.2);
}

/* result cards */

.card{
    background:#1e293b;
    padding:18px;
    border-radius:12px;
    margin-top:18px;
    border:1px solid #334155;
    transition:all .25s ease;
}

.card:hover{
    border-color:#3b82f6;
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
}

.card strong{
    font-size:16px;
}

/* loading */

.loading{
    opacity:.6;
}

/* links */

a{
    color:#60a5fa;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

/* back link */

.back{
    display:inline-block;
    margin-top:25px;
    font-size:14px;
}

/* footer */

.footer{
    text-align:center;
    margin-top:60px;
    font-size:13px;
    color:#94a3b8;
    opacity:.8;
}

</style>
</head>

<body>

<div class="container">

<h1>🖥️ IT Support Tools</h1>
<div class="subtitle">
Search for common error codes and troubleshooting steps
</div>

<select id="categoryFilter">
<option value="all">All Categories</option>
<option value="windows">Windows</option>
<option value="network">Network</option>
<option value="printer">Printer</option>
<option value="hardware">Hardware</option>
</select>

<input type="text" id="searchInput" placeholder="Search error code or issue...">

<div id="results" class="loading">Loading database...</div>

<a class="back" href="index.html">← Back to Home</a>

</div>

    <script>

let errorDatabase = [];
let databaseReady = false;

const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const results = document.getElementById("results");


/* LOAD DATABASE ONCE */
fetch("./errors.json")
.then(res => {

    if(!res.ok){
        throw new Error("HTTP "+res.status);
    }

    return res.json();

})
.then(data => {

    errorDatabase = data;
    databaseReady = true;

    console.log("Database loaded:", errorDatabase.length);

    results.classList.remove("loading");
    results.innerHTML = "";

})
.catch(err => {

    console.error("Database load failed:",err);

    results.innerHTML =
    "<div class='card'>Database failed to load.</div>";

});


/* SIMPLE SEARCH ENGINE */
function searchErrors(){

    if(!databaseReady) return;

    const query = searchInput.value.toLowerCase().trim();
    const category = categoryFilter.value;

    results.innerHTML = "";

    if(!query){
        return;
    }

    const words = query.split(/\s+/);

    let matches = errorDatabase.filter(entry=>{

        if(category !== "all" && entry.category !== category){
            return false;
        }

        const searchable =
        entry.title +
        " " +
        entry.cause +
        " " +
        entry.keywords.join(" ");

        const text = searchable.toLowerCase();

        return words.every(word => text.includes(word));

    });

    if(matches.length === 0){

        results.innerHTML =
        "<div class='card'>No results found.</div>";

        return;

    }

    matches.slice(0,10).forEach(e=>{

        results.innerHTML += `
        <div class="card">
        <strong>${e.title}</strong><br><br>
        <b>Cause:</b> ${e.cause}<br><br>
        <b>Resolution:</b> ${e.fix}
        </div>
        `;

    });

}


/* LIVE SEARCH */

let timeout;

searchInput.addEventListener("input",()=>{

    clearTimeout(timeout);
    timeout = setTimeout(searchErrors,150);

});

categoryFilter.addEventListener("change",searchErrors);
    
</script>

<div class="footer">
Skagestad Labs © 2026
</div>

    
</body>
</html>
