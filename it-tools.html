<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Tools – Microlab</title>

<style>

body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:Arial;
    margin:0;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:auto;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:none;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
    border-left:4px solid #3b82f6;
}

a{
    color:#94a3b8;
}

.loading{
    opacity:0.6;
}

    .footer {
    margin-top: 80px;
    font-size: 13px;
    opacity: 0.6;
}
    
</style>
</head>

<body>

<div class="container">

<h1>🖥️ IT Support Tools</h1>
<p>Search for common error codes and troubleshooting steps.</p>

<select id="categoryFilter">
<option value="all">All Categories</option>
<option value="windows">Windows</option>
<option value="network">Network</option>
<option value="printer">Printer</option>
<option value="hardware">Hardware</option>
</select>

<input type="text" id="searchInput" placeholder="Search error code or issue...">

<div id="results" class="loading">Loading database...</div>

<br>
<a href="index.html">← Back to Home</a>

</div>


<script>

let errorDatabase = [];
let databaseReady = false;

const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const results = document.getElementById("results");


/* LOAD DATABASE ONCE */
fetch("./errors.json")
.then(res => {

    if(!res.ok){
        throw new Error("HTTP "+res.status);
    }

    return res.json();

})
.then(data => {

    errorDatabase = data;
    databaseReady = true;

    console.log("Database loaded:", errorDatabase.length);

    results.classList.remove("loading");
    results.innerHTML = "";

})
.catch(err => {

    console.error("Database load failed:",err);

    results.innerHTML =
    "<div class='card'>Database failed to load.</div>";

});


/* SIMPLE SEARCH ENGINE */
function searchErrors(){

    if(!databaseReady) return;

    const query = searchInput.value.toLowerCase().trim();
    const category = categoryFilter.value;

    results.innerHTML = "";

    if(!query){
        return;
    }

    const words = query.split(/\s+/);

    let matches = errorDatabase.filter(entry=>{

        if(category !== "all" && entry.category !== category){
            return false;
        }

        const searchable =
        entry.title +
        " " +
        entry.cause +
        " " +
        entry.keywords.join(" ");

        const text = searchable.toLowerCase();

        return words.every(word => text.includes(word));

    });

    if(matches.length === 0){

        results.innerHTML =
        "<div class='card'>No results found.</div>";

        return;

    }

    matches.slice(0,10).forEach(e=>{

        results.innerHTML += `
        <div class="card">
        <strong>${e.title}</strong><br><br>
        <b>Cause:</b> ${e.cause}<br><br>
        <b>Resolution:</b> ${e.fix}
        </div>
        `;

    });

}


/* LIVE SEARCH */

let timeout;

searchInput.addEventListener("input",()=>{

    clearTimeout(timeout);
    timeout = setTimeout(searchErrors,150);

});

categoryFilter.addEventListener("change",searchErrors);
    
</script>

<div class="footer">
Skagestad Labs © 2026
</div>
    
</body>
</html>
